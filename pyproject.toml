[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "comphy-python101"
version = "0.1.0"
description = "Mechanism-first Python onboarding for scientific computing"
readme = "README.md"
requires-python = ">=3.11"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
authors = [
  { name = "Vatsal Sanjay", email = "vatsal.sanjay@comphy-lab.org" },
]
keywords = ["python", "scientific-computing", "fluid-mechanics", "education"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Education",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: BSD License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Education",
  "Topic :: Scientific/Engineering",
]
dependencies = [
  "matplotlib>=3.8",
  "numpy>=1.26",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.11",
]
docs = [
  "mkdocs-material>=9.6,<10",
]

[project.scripts]
comphy-python101 = "comphy_python101.cli:main"

[project.urls]
Course = "https://comphy-lab.org/comphy-python101/"
Repository = "https://github.com/comphy-lab/comphy-python101"
Issues = "https://github.com/comphy-lab/comphy-python101/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/comphy_python101"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
pythonpath = ["."]
testpaths = ["tests"]

[tool.coverage.run]
source = ["comphy_python101"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
